version: '3.8'

services:
  backend:
    build: .
    ports:
      - '4000:4000'
    depends_on:
      - mongo
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
    restart: unless-stopped

  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
