version: '3.9'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app/apps/api
    env_file:
      - ./apps/api/.env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: strava_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: strava
      POSTGRES_PASSWORD: password
      POSTGRES_DB: strava_log
    volumes:
      - pgdata:/var/lib/postgresql/data

  mobile-web:
    build:
      context: .
      dockerfile: Dockerfile.expo
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=127.0.0.1
    stdin_open: true
    tty: true

volumes:
  pgdata:
